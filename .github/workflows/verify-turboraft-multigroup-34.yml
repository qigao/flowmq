name: TurboRaft #34 FlowMQ compatibility
# verifier retry 2: require a real hosted runner before interpreting results

on:
  push:
    branches:
      - verify/turboraft-multigroup-34
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FlowMQ
        uses: actions/checkout@v4

      - name: Checkout TurboRaft #34 head and public dependencies
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch feature/multi-group-multiplex             https://github.com/qigao/turboraft.git ../turboraft
          git clone --depth 1 https://github.com/qigao/salts.git ../salts
          git clone --depth 1 https://github.com/qigao/salts-utils.git ../salts-utils

      - name: Compile TurboRaft FlowMQ adapter and tests against private FlowMQ headers
        shell: bash
        run: |
          set -euo pipefail

          INC=(
            -I../turboraft/include
            -I../turboraft/src
            -I../turboraft/src/transport
            -Iflowmq/include
            -I../salts/utils/include
            -I../salts/platform/include
            -I../salts/concurrency/include
            -I../salts/cnet/include
            -I../salts/native-io/include
            -I../salts/cstl/include
            -I../salts/cmeta/include
            -I../salts/tinytest/include
            -I../salts-utils/tbe/data_bind
            -I../salts-utils/tbe/schema/include
          )

          cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             "${INC[@]}" -fsyntax-only             ../turboraft/src/transport/raft_group_queue.c

          cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             "${INC[@]}" -fsyntax-only             ../turboraft/src/transport/raft_flowmq_peer_service.c

          cc -std=c11 -Wall -Wextra             -Werror=implicit-function-declaration             -Werror=incompatible-pointer-types             -Werror=int-conversion             -Werror=return-type             -DTURBORAFT_TEST_FIXTURE_DIR=\"../turboraft/tests/fixtures\"             "${INC[@]}" -fsyntax-only             ../turboraft/tests/core/test_raft_flowmq_peer_service.c
