name: TurboRaft private full-stack acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/turboraft-private-stack-acceptance.yml
  workflow_dispatch:

concurrency:
  group: turboraft-private-full-stack
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBORAFT_REF: 09c4b1fa24f922faa848c00fd218b437b65d1222
  SALTS_REF: ce9b57bc166bf86bd311fe6f86b7619dd64673e1
  SALTS_UTILS_REF: 2ceba0f6c46914600960bc410f5b5453911322ec
  VCPKG_BASELINE: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
  VCPKG_ROOT: ${{ github.workspace }}/.ci/vcpkg
  VCPKG_INSTALLED_DIR: ${{ github.workspace }}/.ci/vcpkg_installed
  SALTS_ROOT: ${{ github.workspace }}/.ci/pkgs/salts
  SALTS_UTILS_ROOT: ${{ github.workspace }}/.ci/pkgs/salts-utils
  FLOWMQ_ROOT: ${{ github.workspace }}/.ci/pkgs/flowmq
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.ci/vcpkg-bincache,readwrite
  LD_LIBRARY_PATH: ${{ github.workspace }}/.ci/pkgs/flowmq/lib:${{ github.workspace }}/.ci/pkgs/salts-utils/lib:${{ github.workspace }}/.ci/pkgs/salts/lib:${{ github.workspace }}/.ci/vcpkg_installed/x64-linux/lib

jobs:
  full-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private FlowMQ exact source
        uses: actions/checkout@v4
        with:
          path: .ci/src/flowmq
          persist-credentials: false

      - name: Checkout pinned public sources
        shell: bash
        run: |
          set -euo pipefail

          clone_exact() {
            local url="$1"
            local ref="$2"
            local dst="$3"
            mkdir -p "$dst"
            git -C "$dst" init -q
            git -C "$dst" remote add origin "$url"
            git -C "$dst" fetch -q --depth 1 origin "$ref"
            git -C "$dst" checkout -q --detach FETCH_HEAD
          }

          clone_exact https://github.com/qigao/turboraft.git "$TURBORAFT_REF" .ci/src/turboraft
          clone_exact https://github.com/qigao/salts.git "$SALTS_REF" .ci/src/salts
          clone_exact https://github.com/qigao/salts-utils.git "$SALTS_UTILS_REF" .ci/src/salts-utils
          clone_exact https://github.com/microsoft/vcpkg.git "$VCPKG_BASELINE" .ci/vcpkg

          test "$(git -C .ci/src/turboraft rev-parse HEAD)" = "$TURBORAFT_REF"
          test "$(git -C .ci/src/salts rev-parse HEAD)" = "$SALTS_REF"
          test "$(git -C .ci/src/salts-utils rev-parse HEAD)" = "$SALTS_UTILS_REF"

      - name: Install host build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential libtool ninja-build pkg-config re2c
          mkdir -p .ci/vcpkg-bincache .ci/vcpkg_installed .ci/super-manifest .ci/pkgs

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .ci/vcpkg-bincache
          key: vcpkg-linux-${{ env.VCPKG_BASELINE }}-turboraft-private-full-v1

      - name: Bootstrap vcpkg and install dependency union
        shell: bash
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          cat > .ci/super-manifest/vcpkg.json <<'JSON'
          {
            "name": "turboraft-private-full-stack-ci",
            "version-semver": "0.1.0",
            "builtin-baseline": "b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01",
            "dependencies": [
              { "name": "pkgconf", "host": true },
              "simde",
              "zstd",
              "aklomp-base64",
              "c-ares",
              "libuv",
              "kcp",
              "boringssl",
              "miniaudio",
              "lua",
              { "name": "zeromq", "default-features": false },
              { "name": "xxhash", "version>=": "0.8.3" }
            ],
            "overrides": [
              { "name": "c-ares", "version": "1.34.5", "port-version": 1 }
            ]
          }
          JSON
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/.ci/super-manifest" \
            --x-install-root="$VCPKG_INSTALLED_DIR" \
            --triplet=x64-linux

      - name: Build and install pinned Salts
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/salts -B .ci/build/salts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$SALTS_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF
          cmake --build .ci/build/salts --target install --parallel 2

      - name: Build and install pinned SaltsUtils
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/salts-utils -B .ci/build/salts-utils -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$SALTS_UTILS_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF \
            -DSALTS_UTILS_ENABLE_CAPTURE=OFF -DSALTS_UTILS_ENABLE_CFLOW_USB=OFF
          cmake --build .ci/build/salts-utils --target install --parallel 2
          test -x "$SALTS_UTILS_ROOT/bin/tbe_compiler"

      - name: Build and install private FlowMQ
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/flowmq -B .ci/build/flowmq -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_INSTALL_PREFIX="$FLOWMQ_ROOT" \
            -DBUILD_TESTING=OFF -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build .ci/build/flowmq --target install --parallel 2

      - name: Validate dependency package roots
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SALTS_ROOT/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$SALTS_UTILS_ROOT/lib/cmake/SaltsUtils/SaltsUtilsConfig.cmake"
          test -x "$SALTS_UTILS_ROOT/bin/tbe_compiler"
          test -f "$FLOWMQ_ROOT/lib/cmake/FlowMQ/FlowMQConfig.cmake"

      - name: Configure TurboRaft Release with tests
        shell: bash
        run: |
          set -euo pipefail
          cmake -S .ci/src/turboraft -B .ci/build/turboraft -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$VCPKG_INSTALLED_DIR" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DBUILD_TESTING=ON -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF

      - name: Build TurboRaft Release
        shell: bash
        run: |
          set -euo pipefail
          cmake --build .ci/build/turboraft --parallel 2

      - name: Targeted production integration gates
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir .ci/build/turboraft \
            -R 'turboraft\.(flowmq_peer_service|multiprocess_chaos)$' \
            --output-on-failure

      - name: Full Release CTest
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir .ci/build/turboraft --output-on-failure

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turboraft-private-full-stack-diagnostics
          path: .ci/build/turboraft/Testing/Temporary
          if-no-files-found: ignore
