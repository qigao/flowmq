name: Temporary queued SG benchmark

on:
  push:
    branches:
      - perf/issue-35-cnet-retained-sg
    paths:
      - ".github/workflows/queued-sg-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Prepare dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm

          install_root="$RUNNER_TEMP/flowmq-vcpkg-installed"
          "$VCPKG_ROOT/vcpkg" install             --x-manifest-root=.             --x-install-root="$install_root"             --triplet x64-linux             --only-binarycaching
          echo "FLOWMQ_VCPKG_INSTALLED=$install_root" >> "$GITHUB_ENV"

          config="$RUNNER_TEMP/flowmq-sdk-nuget.config"
          project="$RUNNER_TEMP/flowmq-sdk-restore.csproj"
          packages="$RUNNER_TEMP/flowmq-sdk-packages"
          cat > "$project" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Salts.Native" Version="[1.7.9]" />
              <PackageReference Include="SaltsUtils.Native" Version="[4.0.1]" />
            </ItemGroup>
          </Project>
          EOF
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json             --name github --username qigao --password "$GITHUB_TOKEN"             --store-password-in-clear-text --configfile "$config"
          dotnet restore "$project" --configfile "$config" --packages "$packages"

          echo "SALTS_ROOT=$packages/salts.native/1.7.9/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$packages/saltsutils.native/4.0.1/sdk/linux-x64" >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create base worktree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/flowmq-base" 2a91a1c241112ecbb23674485f19ee480ff8a23f

      - name: Focus benchmark on queued batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          roots = [Path(os.environ["RUNNER_TEMP"]) / "flowmq-base", Path(".")]
          for root in roots:
              path = root / "flowmq/benchmarks/runtime/bench_flowmq_socket.c"
              text = path.read_text()
              text = text.replace("BENCH_SAMPLES = 100000u,", "BENCH_SAMPLES = 1u,")
              text = text.replace("BENCH_LARGE_SAMPLES = 5000u,", "BENCH_LARGE_SAMPLES = 1u,")
              text = text.replace("BENCH_PAYLOAD_BYTES = 64u,", "BENCH_PAYLOAD_BYTES = 60u * 1024u,")
              text = text.replace("BENCH_BATCH_SAMPLES = 10000u,", "BENCH_BATCH_SAMPLES = 300u,")
              text = text.replace("BENCH_BATCH_MESSAGES = 64u,", "BENCH_BATCH_MESSAGES = 16u,")
              path.write_text(text)
          PY

      - name: Build base and SG head benchmark
        shell: bash
        run: |
          set -euo pipefail
          common_args=(
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            -DVCPKG_TARGET_TRIPLET=x64-linux
            -DVCPKG_MANIFEST_MODE=OFF
            -DVCPKG_INSTALLED_DIR="$FLOWMQ_VCPKG_INSTALLED"
            -DBUILD_TESTS=OFF
            -DBUILD_EXAMPLES=OFF
          )
          cmake -S "$RUNNER_TEMP/flowmq-base" -B "$RUNNER_TEMP/build-base" "${common_args[@]}"
          cmake --build "$RUNNER_TEMP/build-base" --target bench_flowmq_socket --parallel 2

          cmake -S . -B "$RUNNER_TEMP/build-head" "${common_args[@]}"
          cmake --build "$RUNNER_TEMP/build-head" --target bench_flowmq_socket --parallel 2

      - name: Warm up
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$FLOWMQ_VCPKG_INSTALLED/x64-linux/lib"
          "$RUNNER_TEMP/build-base/bin/bench_flowmq_socket" >/dev/null
          "$RUNNER_TEMP/build-head/bin/bench_flowmq_socket" >/dev/null

      - name: Measure base three times
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$FLOWMQ_VCPKG_INSTALLED/x64-linux/lib"
          for run in 1 2 3; do
            echo "=== BASE RUN $run ==="
            "$RUNNER_TEMP/build-base/bin/bench_flowmq_socket"
          done

      - name: Measure retained SG head three times
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$FLOWMQ_VCPKG_INSTALLED/x64-linux/lib"
          for run in 1 2 3; do
            echo "=== SG HEAD RUN $run ==="
            "$RUNNER_TEMP/build-head/bin/bench_flowmq_socket"
          done
