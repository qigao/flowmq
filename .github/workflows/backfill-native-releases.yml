name: Backfill FlowMQ GitHub Releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-native-releases.yml"

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - name: Download qualified package artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/1.1.0 dist/1.1.1
          gh run download 36437958387 --repo "$GITHUB_REPOSITORY" \
            --name flowmq-native-nuget --dir dist/1.1.0
          gh run download 36503751749 --repo "$GITHUB_REPOSITORY" \
            --name flowmq-native-nuget --dir dist/1.1.1
          test -f dist/1.1.0/FlowMQ.Native.1.1.0.nupkg
          test -f dist/1.1.1/FlowMQ.Native.1.1.1.nupkg

      - name: Backfill FlowMQ 1.1.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.1.0
          pkg=dist/1.1.0/FlowMQ.Native.1.1.0.nupkg
          target=9a0059eaeb653ef8d97b13ad2b7a23a14f5875af
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" \
              --target "$target" --title "FlowMQ 1.1.0" --generate-notes
          fi

      - name: Backfill FlowMQ 1.1.1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.1.1
          pkg=dist/1.1.1/FlowMQ.Native.1.1.1.nupkg
          target=82a12cca0d1ce9dd2fc0448a6646eddebacfc598
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" \
              --target "$target" --title "FlowMQ 1.1.1" --generate-notes
          fi
