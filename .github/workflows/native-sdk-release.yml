name: FlowMQ native SDK package

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "flowmq/**"
      - "tests/package/**"
      - "vcpkg.json"
      - "packaging/nuget/**"
      - ".github/workflows/native-sdk-release.yml"
  push:
    tags:
      - "v*"
    paths:
      - "CMakeLists.txt"
      - "cmake/**"
      - "flowmq/**"
      - "tests/package/**"
      - "vcpkg.json"
      - "packaging/nuget/**"
      - ".github/workflows/native-sdk-release.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: flowmq-sdk-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR qualification should release scarce platform runners, while
  # tag publication remains exact and is never cancelled by a later run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_version: ${{ steps.meta.outputs.source_version }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve source and package version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_commit="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected_tag="v$source_version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "release tag mismatch: pushed=$GITHUB_REF_NAME expected=$expected_tag" >&2
              exit 1
            fi
            version="$source_version"
          else
            version="$source_version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64 SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm
      - name: Restore released native SDK dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/flowmq-linux-nuget.config"
          packages="$RUNNER_TEMP/flowmq-linux-dependencies"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet restore packaging/nuget/FlowMQ.Native.csproj --configfile "$config" --packages "$packages"
          salts_versions=("$packages/salts.native"/*)
          salts_utils_versions=("$packages/saltsutils.native"/*)
          test "${#salts_versions[@]}" -eq 1
          test "${#salts_utils_versions[@]}" -eq 1
          salts_pkg="${salts_versions[0]}"
          salts_utils_pkg="${salts_utils_versions[0]}"
          test -d "$salts_pkg"
          test -d "$salts_utils_pkg"
          echo "SALTS_ROOT=$salts_pkg/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$salts_utils_pkg/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "FLOWMQ_SALTS_RESOLVED_VERSION=$(basename "$salts_pkg")" >> "$GITHUB_ENV"
          echo "FLOWMQ_SALTS_UTILS_RESOLVED_VERSION=$(basename "$salts_utils_pkg")" >> "$GITHUB_ENV"
      - name: Verify FlowMQ vcpkg cache hits
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet x64-linux \
            --only-binarycaching
      - name: Configure, build, test and install
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          cmake -S . -B build/flowmq -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib"
          cmake --build build/flowmq --parallel 2
          ctest --test-dir build/flowmq --no-tests=error --output-on-failure
          cmake --install build/flowmq --strip
          cat > "$prefix/flowmq-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          source_version=${{ needs.metadata.outputs.source_version }}
          repository=https://github.com/qigao/flowmq
          source_ref=${{ github.ref_name }}
          commit=${{ needs.metadata.outputs.source_commit }}
          salts=$FLOWMQ_SALTS_RESOLVED_VERSION
          salts_utils=$FLOWMQ_SALTS_UTILS_RESOLVED_VERSION
          rid=linux-x64
          build_type=Release
          qualification=runtime
          EOF
          cp -aL stage stage-dereferenced
          rm -rf stage
          mv stage-dereferenced stage
      - name: Run FlowMQ owner-affine multicore benchmark
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib"
          result_dir="$GITHUB_WORKSPACE/flowmq-benchmark-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_owner_parallel"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ owner-parallel benchmark executable not found: $benchmark" >&2
            exit 1
          fi

          allowed="$(taskset -pc "$BASHPID" | sed 's/.*: //')"
          topology="$result_dir/cpu-topology.csv"
          lscpu -p=CPU,CORE,SOCKET > "$topology"

          expand_cpuset() {
            local spec="$1"
            local part start end cpu
            IFS=',' read -ra parts <<< "$spec"
            for part in "${parts[@]}"; do
              if [[ "$part" == *-* ]]; then
                start="${part%-*}"
                end="${part#*-}"
                for ((cpu = start; cpu <= end; ++cpu)); do echo "$cpu"; done
              else
                echo "$part"
              fi
            done
          }

          mapfile -t cpus < <(expand_cpuset "$allowed")
          if (( ${#cpus[@]} == 0 )); then
            echo "No CPUs found in allowed set: $allowed" >&2
            exit 1
          fi
          first="${cpus[0]}"
          first_key="$(awk -F, -v cpu="$first" '$1 == cpu {print $2 ":" $3; exit}' "$topology")"
          if [[ -z "$first_key" ]]; then
            echo "CPU topology is unavailable for CPU $first" >&2
            exit 1
          fi
          same_core=""
          distinct_core=""
          for cpu in "${cpus[@]:1}"; do
            key="$(awk -F, -v wanted="$cpu" '$1 == wanted {print $2 ":" $3; exit}' "$topology")"
            [[ -z "$key" ]] && continue
            if [[ "$key" == "$first_key" && -z "$same_core" ]]; then
              same_core="$cpu"
            elif [[ "$key" != "$first_key" && -z "$distinct_core" ]]; then
              distinct_core="$cpu"
            fi
          done

          run_case() {
            local label="$1"
            local cpuset="$2"
            [[ -z "$cpuset" || "$cpuset" == "unavailable" ]] && return 0
            local cpu_a="${cpuset%%,*}"
            local cpu_b="$cpu_a"
            if [[ "$cpuset" == *,* ]]; then
              cpu_b="${cpuset##*,}"
            fi
            local prefix="$result_dir/flowmq-owner-parallel-$label"
            export FLOWMQ_OWNER_PARALLEL_TOPOLOGY="$label"
            export FLOWMQ_OWNER_PARALLEL_CPU_A="$cpu_a"
            export FLOWMQ_OWNER_PARALLEL_CPU_B="$cpu_b"
            export FLOWMQ_OWNER_PARALLEL_OUTPUT="$prefix"

            "$benchmark" 2>&1 | tee "$prefix.md"
            {
              echo ""
              echo "## FlowMQ owner-affine multicore: $label (owners $cpu_a,$cpu_b)"
              echo ""
              cat "$prefix.md"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "runner_allowed_cpu_set=$allowed" > "$result_dir/cpu-set.txt"
          echo "one_cpu_set=$first" >> "$result_dir/cpu-set.txt"
          echo "two_cpu_same_core_set=$([[ -n "$same_core" ]] && echo "$first,$same_core" || echo unavailable)" >> "$result_dir/cpu-set.txt"
          echo "two_cpu_distinct_core_set=$([[ -n "$distinct_core" ]] && echo "$first,$distinct_core" || echo unavailable)" >> "$result_dir/cpu-set.txt"

          run_case one_cpu "$first"
          if [[ -n "$same_core" ]]; then
            run_case two_cpu_same_core "$first,$same_core"
          else
            echo "No SMT sibling is available on the first physical core; same-core case skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$distinct_core" ]]; then
            run_case two_cpu_distinct_core "$first,$distinct_core"
          else
            echo "No distinct physical core is available; distinct-core case skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run FlowMQ shared owner-wait benchmark
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib"
          source "$GITHUB_WORKSPACE/flowmq-benchmark-results/cpu-set.txt"
          result_dir="$GITHUB_WORKSPACE/flowmq-shared-wait-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_owner_shared_wait"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ shared-wait benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          export FLOWMQ_SHARED_WAIT_CPU="$one_cpu_set"
          export FLOWMQ_SHARED_WAIT_OUTPUT="$result_dir/flowmq-shared-wait"
          "$benchmark" 2>&1 | tee "$result_dir/flowmq-shared-wait.md"
          {
            echo ""
            echo "## FlowMQ public owner lane vs legacy multi-socket poll (owner CPU $one_cpu_set)"
            echo ""
            cat "$result_dir/flowmq-shared-wait.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run FlowMQ reuse-port multicore service benchmark
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib"
          source "$GITHUB_WORKSPACE/flowmq-benchmark-results/cpu-set.txt"
          result_dir="$GITHUB_WORKSPACE/flowmq-reuse-port-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_reuse_port_multicore"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ reuse-port benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          if [[ "$two_cpu_distinct_core_set" == "unavailable" ]]; then
            echo "No distinct physical core pair is available; reuse-port multicore benchmark skipped." | tee "$result_dir/skipped.md" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cpu_a="${two_cpu_distinct_core_set%%,*}"
            cpu_b="${two_cpu_distinct_core_set##*,}"
            export FLOWMQ_REUSE_PORT_CPU_A="$cpu_a"
            export FLOWMQ_REUSE_PORT_CPU_B="$cpu_b"
            export FLOWMQ_REUSE_PORT_OUTPUT="$result_dir/flowmq-reuse-port-multicore"
            "$benchmark" 2>&1 | tee "$result_dir/flowmq-reuse-port-multicore.md"
            {
              echo ""
              echo "## FlowMQ same-endpoint reuse-port multicore service (owners $cpu_a,$cpu_b)"
              echo ""
              cat "$result_dir/flowmq-reuse-port-multicore.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run FlowMQ retained TLS natural framing benchmark
        shell: bash
        env:
          FLOWMQ_BENCH_CI: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib"
          result_dir="$GITHUB_WORKSPACE/flowmq-retained-tls-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_socket"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ socket benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          log="$result_dir/flowmq-retained-tls.md"
          "$benchmark" 2>&1 | tee "$log"
          if grep -q '^TLS_EVIDENCE_FAIL ' "$log"; then
            echo "TLS retained evidence contains a failed operation" >&2
            exit 1
          fi
          if grep -q '^OWNED_RX_EVIDENCE_FAIL ' "$log"; then
            echo "owned receive evidence contains a failed operation" >&2
            exit 1
          fi
          grep -q '^OWNED_RX_EVIDENCE_BEGIN transport=tcp$' "$log"
          grep -q '^OWNED_RX_EVIDENCE_END transport=tcp$' "$log"
          for payload in 64 65536 1048576; do
            grep -q "^OWNED_RX_EVIDENCE mode=copy payload_bytes=$payload " "$log"
            grep -q "^OWNED_RX_EVIDENCE mode=slice payload_bytes=$payload " "$log"
            grep -q "^OWNED_RX_EVIDENCE mode=slicev payload_bytes=$payload " "$log"
          done
          grep -Eq '^OWNED_RX_EVIDENCE mode=slice payload_bytes=64 .*direct_hits=[1-9][0-9]* ' "$log"
          grep -Eq '^OWNED_RX_EVIDENCE mode=slice payload_bytes=1048576 .*direct_hits=0 ' "$log"
          grep -Eq '^OWNED_RX_EVIDENCE mode=slicev payload_bytes=64 .*payload_copy_contract=0 contract_basis=owned_single_range$' "$log"
          grep -Eq '^OWNED_RX_EVIDENCE mode=slicev payload_bytes=65536 .*payload_copy_contract=0 contract_basis=owned_single_range$' "$log"
          grep -Eq '^OWNED_RX_EVIDENCE mode=slicev payload_bytes=1048576 .*multi_range_hits=[1-9][0-9]* .*range_count_min=[2-9][0-9]* .*payload_copy_contract=0 contract_basis=owned_vector$' "$log"
          sed -n '/^OWNED_RX_EVIDENCE_BEGIN /,/^OWNED_RX_EVIDENCE_END /p' "$log" \
            > "$result_dir/flowmq-owned-receive.md"
          grep -q '^TLS_EVIDENCE_BEGIN layout=natural_discontiguous$' "$log"
          grep -q '^TLS_EVIDENCE_END layout=natural_discontiguous$' "$log"
          for row in copy_64b retained_64b copy_64k retained_64k copy_1m retained_1m copy_2x256k retained_2x256k; do
            grep -q "^TLS_EVIDENCE name=$row " "$log"
          done
          {
            echo ""
            echo "## FlowMQ retained TLS natural framing"
            echo ""
            sed -n '/^TLS_EVIDENCE_BEGIN /,/^TLS_EVIDENCE_END /p' "$log"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-owned-receive-linux-x64
          path: flowmq-retained-tls-results/flowmq-owned-receive.md
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-retained-tls-linux-x64
          path: flowmq-retained-tls-results
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-reuse-port-linux-x64
          path: flowmq-reuse-port-results
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-shared-wait-linux-x64
          path: flowmq-shared-wait-results
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-owner-parallel-linux-x64
          path: flowmq-benchmark-results
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-sdk-linux-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows x64 SDK
    needs: metadata
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare build tools and MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain was not found" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      - name: Restore released native SDK dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Join-Path $env:RUNNER_TEMP "flowmq-windows-nuget.config"
          $packages = Join-Path $env:RUNNER_TEMP "flowmq-windows-dependencies"
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content -LiteralPath $config
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password $env:GITHUB_TOKEN --store-password-in-clear-text --configfile $config
          dotnet restore packaging/nuget/FlowMQ.Native.csproj --configfile $config --packages $packages
          $saltsVersions = @(Get-ChildItem -LiteralPath (Join-Path $packages "salts.native") -Directory)
          $saltsUtilsVersions = @(Get-ChildItem -LiteralPath (Join-Path $packages "saltsutils.native") -Directory)
          if ($saltsVersions.Count -ne 1) { throw "expected one Salts.Native version, found $($saltsVersions.Count)" }
          if ($saltsUtilsVersions.Count -ne 1) { throw "expected one SaltsUtils.Native version, found $($saltsUtilsVersions.Count)" }
          $saltsPkg = $saltsVersions[0]
          $saltsUtilsPkg = $saltsUtilsVersions[0]
          "SALTS_ROOT=$($saltsPkg.FullName)\sdk\windows-x64" >> $env:GITHUB_ENV
          "SALTS_UTILS_ROOT=$($saltsUtilsPkg.FullName)\sdk\windows-x64" >> $env:GITHUB_ENV
          "FLOWMQ_SALTS_RESOLVED_VERSION=$($saltsPkg.Name)" >> $env:GITHUB_ENV
          "FLOWMQ_SALTS_UTILS_RESOLVED_VERSION=$($saltsUtilsPkg.Name)" >> $env:GITHUB_ENV
      - name: Verify FlowMQ vcpkg cache hits
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          & "$env:VCPKG_ROOT\vcpkg.exe" install "--x-manifest-root=." "--x-install-root=$installRoot" "--triplet=x64-windows" --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "FlowMQ x64-windows cache-only restore failed" }
      - name: Configure, build, test and install
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "PATH=%SALTS_UTILS_ROOT%\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S . -B build/flowmq -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DVCPKG_MANIFEST_MODE=OFF ^
            -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed" ^
            -DCMAKE_INSTALL_PREFIX="%GITHUB_WORKSPACE%\stage\sdk\windows-x64" ^
            -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build build/flowmq --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir build/flowmq --no-tests=error --output-on-failure
          if errorlevel 1 exit /b 1
          cmake --install build/flowmq --config Release
          if errorlevel 1 exit /b 1
      - name: Record Windows SDK provenance
        shell: pwsh
        run: |
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          @(
            "version=${{ needs.metadata.outputs.version }}"
            "source_version=${{ needs.metadata.outputs.source_version }}"
            "repository=https://github.com/qigao/flowmq"
            "source_ref=${{ github.ref_name }}"
            "commit=${{ needs.metadata.outputs.source_commit }}"
            "salts=$env:FLOWMQ_SALTS_RESOLVED_VERSION"
            "salts_utils=$env:FLOWMQ_SALTS_UTILS_RESOLVED_VERSION"
            "rid=windows-x64"
            "build_type=Release"
            "qualification=runtime"
          ) | Set-Content -LiteralPath (Join-Path $prefix "flowmq-sdk-manifest.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-sdk-windows-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  macos:
    name: macOS SDK
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ninja nasm
          case "$RUNNER_ARCH" in
            X64) rid=macos-x64; triplet=x64-osx ;;
            ARM64) rid=macos-arm64; triplet=arm64-osx ;;
            *) echo "unsupported macOS runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "FLOWMQ_RID=$rid" >> "$GITHUB_ENV"
          echo "FLOWMQ_TRIPLET=$triplet" >> "$GITHUB_ENV"
      - name: Restore released native SDK dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/flowmq-macos-nuget.config"
          packages="$RUNNER_TEMP/flowmq-macos-dependencies"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet restore packaging/nuget/FlowMQ.Native.csproj --configfile "$config" --packages "$packages"
          salts_versions=("$packages/salts.native"/*)
          salts_utils_versions=("$packages/saltsutils.native"/*)
          test "${#salts_versions[@]}" -eq 1
          test "${#salts_utils_versions[@]}" -eq 1
          salts_pkg="${salts_versions[0]}"
          salts_utils_pkg="${salts_utils_versions[0]}"
          test -d "$salts_pkg"
          test -d "$salts_utils_pkg"
          echo "SALTS_ROOT=$salts_pkg/sdk/$FLOWMQ_RID" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$salts_utils_pkg/sdk/$FLOWMQ_RID" >> "$GITHUB_ENV"
          echo "FLOWMQ_SALTS_RESOLVED_VERSION=$(basename "$salts_pkg")" >> "$GITHUB_ENV"
          echo "FLOWMQ_SALTS_UTILS_RESOLVED_VERSION=$(basename "$salts_utils_pkg")" >> "$GITHUB_ENV"
      - name: Verify FlowMQ vcpkg cache hits
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet "$FLOWMQ_TRIPLET" \
            --only-binarycaching
      - name: Configure, build, test and install
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/$FLOWMQ_RID"
          cmake -S . -B build/flowmq -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="$FLOWMQ_TRIPLET" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF
          export DYLD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/$FLOWMQ_TRIPLET/lib"
          cmake --build build/flowmq --parallel 2
          ctest --test-dir build/flowmq --no-tests=error --output-on-failure
          cmake --install build/flowmq --strip
          cat > "$prefix/flowmq-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          source_version=${{ needs.metadata.outputs.source_version }}
          repository=https://github.com/qigao/flowmq
          source_ref=${{ github.ref_name }}
          commit=${{ needs.metadata.outputs.source_commit }}
          salts=$FLOWMQ_SALTS_RESOLVED_VERSION
          salts_utils=$FLOWMQ_SALTS_UTILS_RESOLVED_VERSION
          rid=$FLOWMQ_RID
          build_type=Release
          qualification=runtime
          EOF
          cp -aL stage stage-dereferenced
          rm -rf stage
          mv stage-dereferenced stage
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-sdk-macos
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  android:
    name: Android arm64-v8a SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Prepare build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm
          test -n "$ANDROID_NDK_HOME"
      - name: Restore target and host native SDK dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/flowmq-android-nuget.config"
          packages="$RUNNER_TEMP/flowmq-android-dependencies"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet restore packaging/nuget/FlowMQ.Native.csproj --configfile "$config" --packages "$packages"
          salts_versions=("$packages/salts.native"/*)
          salts_utils_versions=("$packages/saltsutils.native"/*)
          test "${#salts_versions[@]}" -eq 1
          test "${#salts_utils_versions[@]}" -eq 1
          salts_pkg="${salts_versions[0]}"
          salts_utils_pkg="${salts_utils_versions[0]}"
          test -d "$salts_pkg"
          test -d "$salts_utils_pkg"
          echo "SALTS_ROOT=$salts_pkg/sdk/android-arm64-v8a" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$salts_utils_pkg/sdk/android-arm64-v8a" >> "$GITHUB_ENV"
          echo "SALTS_HOST_ROOT=$salts_pkg/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_HOST_ROOT=$salts_utils_pkg/sdk/linux-x64" >> "$GITHUB_ENV"
          echo "FLOWMQ_SALTS_RESOLVED_VERSION=$(basename "$salts_pkg")" >> "$GITHUB_ENV"
          echo "FLOWMQ_SALTS_UTILS_RESOLVED_VERSION=$(basename "$salts_utils_pkg")" >> "$GITHUB_ENV"
      - name: Verify FlowMQ vcpkg cache hits
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet arm64-android \
            --only-binarycaching
      - name: Configure, build and install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          cmake -S . -B build/flowmq -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build build/flowmq --parallel 2
          cmake --install build/flowmq
          cat > "$prefix/flowmq-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          source_version=${{ needs.metadata.outputs.source_version }}
          repository=https://github.com/qigao/flowmq
          source_ref=${{ github.ref_name }}
          commit=${{ needs.metadata.outputs.source_commit }}
          salts=$FLOWMQ_SALTS_RESOLVED_VERSION
          salts_utils=$FLOWMQ_SALTS_UTILS_RESOLVED_VERSION
          rid=android-arm64-v8a
          android_api=26
          build_type=Release
          qualification=compile-link
          EOF
          cp -aL stage stage-dereferenced
          rm -rf stage
          mv stage-dereferenced stage
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-sdk-android-arm64-v8a
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack FlowMQ.Native
    needs: [metadata, linux, windows, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: flowmq-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify combined SDK payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/FlowMQ/FlowMQConfig.cmake
          test -f package/sdk/windows-x64/lib/cmake/FlowMQ/FlowMQConfig.cmake
          test -f package/sdk/android-arm64-v8a/lib/cmake/FlowMQ/FlowMQConfig.cmake
          mapfile -t mac_dirs < <(find package/sdk -mindepth 1 -maxdepth 1 -type d -name 'macos-*' -print)
          test "${#mac_dirs[@]}" -eq 1
          test -f "${mac_dirs[0]}/lib/cmake/FlowMQ/FlowMQConfig.cmake"
          test "$(find package/sdk -maxdepth 2 -name flowmq-sdk-manifest.txt | wc -l)" -eq 4
          find package/sdk -maxdepth 2 -name flowmq-sdk-manifest.txt -print
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack multi-platform NuGet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/flowmq-pack-nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet restore packaging/nuget/FlowMQ.Native.csproj --configfile "$config" --packages "$RUNNER_TEMP/flowmq-pack-dependencies"
          dotnet pack packaging/nuget/FlowMQ.Native.csproj --no-restore \
            --configuration Release --output dist \
            -p:PackageVersion="${{ needs.metadata.outputs.version }}" \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RestorePackagesPath="$RUNNER_TEMP/flowmq-pack-dependencies"
          nupkg="dist/FlowMQ.Native.${{ needs.metadata.outputs.version }}.nupkg"
          test -f "$nupkg"
          unzip -p "$nupkg" FlowMQ.Native.nuspec > "$RUNNER_TEMP/flowmq-native.nuspec"
          if grep -Eq 'Salts\.Native|SaltsUtils\.Native' "$RUNNER_TEMP/flowmq-native.nuspec"; then
            echo "FlowMQ.Native must not pin first-party producer packages in nuspec metadata" >&2
            cat "$RUNNER_TEMP/flowmq-native.nuspec" >&2
            exit 1
          fi
          unzip -Z1 "$nupkg" > "$RUNNER_TEMP/flowmq-files.txt"
          for rid in linux-x64 windows-x64 android-arm64-v8a; do
            grep -Fx "sdk/$rid/lib/cmake/FlowMQ/FlowMQConfig.cmake" "$RUNNER_TEMP/flowmq-files.txt"
            grep -Fx "sdk/$rid/flowmq-sdk-manifest.txt" "$RUNNER_TEMP/flowmq-files.txt"
          done
          mac_rid="$(basename "$(find package/sdk -mindepth 1 -maxdepth 1 -type d -name 'macos-*' -print -quit)")"
          grep -Fx "sdk/$mac_rid/lib/cmake/FlowMQ/FlowMQConfig.cmake" "$RUNNER_TEMP/flowmq-files.txt"
          grep -Fx "sdk/$mac_rid/flowmq-sdk-manifest.txt" "$RUNNER_TEMP/flowmq-files.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  qualify:
    name: Qualify ${{ matrix.name }}
    needs: [metadata, pack]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: linux
            runner: ubuntu-24.04
            rid: linux-x64
            triplet: x64-linux
          - name: Windows x64
            os: windows
            runner: windows-2022
            rid: windows-x64
            triplet: x64-windows
          - name: macOS host
            os: macos
            runner: macos-15
            rid: macos-host
            triplet: osx-host
          - name: Android arm64-v8a
            os: android
            runner: ubuntu-24.04
            rid: android-arm64-v8a
            triplet: arm64-android
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/download-artifact@v4
        with:
          name: flowmq-native-nuget
          path: dist
      - name: Prepare Unix qualification host
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.os }}" == "macos" ]]; then
            brew install ninja nasm
            case "$RUNNER_ARCH" in
              X64) rid=macos-x64; triplet=x64-osx ;;
              ARM64) rid=macos-arm64; triplet=arm64-osx ;;
              *) echo "unsupported macOS runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
            esac
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build pkg-config nasm
            rid="${{ matrix.rid }}"
            triplet="${{ matrix.triplet }}"
          fi
          if [[ "${{ matrix.os }}" == "android" ]]; then test -n "$ANDROID_NDK_HOME"; fi
          echo "FLOWMQ_RID=$rid" >> "$GITHUB_ENV"
          echo "FLOWMQ_TRIPLET=$triplet" >> "$GITHUB_ENV"
      - name: Prepare Windows qualification host
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install nasm ninja -y --no-progress
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $vswhere = Join-Path $programFilesX86 "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain was not found" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "FLOWMQ_RID=windows-x64" >> $env:GITHUB_ENV
          "FLOWMQ_TRIPLET=x64-windows" >> $env:GITHUB_ENV
      - name: Restore packed SDK on Unix
        if: matrix.os != 'windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/flowmq-qualify-nuget.config"
          project="$RUNNER_TEMP/flowmq-qualify.csproj"
          packages="$RUNNER_TEMP/flowmq-qualify-packages"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source "$GITHUB_WORKSPACE/dist" --name local --configfile "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          cat > "$project" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="FlowMQ.Native" Version="[${{ needs.metadata.outputs.version }}]" />
              <PackageReference Include="Salts.Native" Version="*" />
              <PackageReference Include="SaltsUtils.Native" Version="*" />
            </ItemGroup>
          </Project>
          EOF
          dotnet restore "$project" --configfile "$config" --packages "$packages"
          salts_versions=("$packages/salts.native"/*)
          salts_utils_versions=("$packages/saltsutils.native"/*)
          test "${#salts_versions[@]}" -eq 1
          test "${#salts_utils_versions[@]}" -eq 1
          salts_pkg="${salts_versions[0]}"
          salts_utils_pkg="${salts_utils_versions[0]}"
          test -d "$salts_pkg"
          test -d "$salts_utils_pkg"
          echo "SALTS_ROOT=$salts_pkg/sdk/$FLOWMQ_RID" >> "$GITHUB_ENV"
          echo "SALTS_UTILS_ROOT=$salts_utils_pkg/sdk/$FLOWMQ_RID" >> "$GITHUB_ENV"
          echo "FLOWMQ_SALTS_RESOLVED_VERSION=$(basename "$salts_pkg")" >> "$GITHUB_ENV"
          echo "FLOWMQ_SALTS_UTILS_RESOLVED_VERSION=$(basename "$salts_utils_pkg")" >> "$GITHUB_ENV"
          echo "FLOWMQ_PREFIX=$packages/flowmq.native/${{ needs.metadata.outputs.version }}/sdk/$FLOWMQ_RID" >> "$GITHUB_ENV"
      - name: Restore packed SDK on Windows
        if: matrix.os == 'windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $config = Join-Path $env:RUNNER_TEMP "flowmq-qualify-nuget.config"
          $project = Join-Path $env:RUNNER_TEMP "flowmq-qualify.csproj"
          $packages = Join-Path $env:RUNNER_TEMP "flowmq-qualify-packages"
          '<configuration><packageSources><clear /></packageSources></configuration>' | Set-Content -LiteralPath $config
          dotnet nuget add source (Join-Path $env:GITHUB_WORKSPACE "dist") --name local --configfile $config
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json --name github --username qigao --password $env:GITHUB_TOKEN --store-password-in-clear-text --configfile $config
          @"
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net8.0</TargetFramework></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="FlowMQ.Native" Version="[${{ needs.metadata.outputs.version }}]" />
              <PackageReference Include="Salts.Native" Version="*" />
              <PackageReference Include="SaltsUtils.Native" Version="*" />
            </ItemGroup>
          </Project>
          "@ | Set-Content -LiteralPath $project
          dotnet restore $project --configfile $config --packages $packages
          $saltsVersions = @(Get-ChildItem -LiteralPath (Join-Path $packages "salts.native") -Directory)
          $saltsUtilsVersions = @(Get-ChildItem -LiteralPath (Join-Path $packages "saltsutils.native") -Directory)
          if ($saltsVersions.Count -ne 1) { throw "expected one Salts.Native version, found $($saltsVersions.Count)" }
          if ($saltsUtilsVersions.Count -ne 1) { throw "expected one SaltsUtils.Native version, found $($saltsUtilsVersions.Count)" }
          $saltsPkg = $saltsVersions[0]
          $saltsUtilsPkg = $saltsUtilsVersions[0]
          "SALTS_ROOT=$($saltsPkg.FullName)\sdk\windows-x64" >> $env:GITHUB_ENV
          "SALTS_UTILS_ROOT=$($saltsUtilsPkg.FullName)\sdk\windows-x64" >> $env:GITHUB_ENV
          "FLOWMQ_SALTS_RESOLVED_VERSION=$($saltsPkg.Name)" >> $env:GITHUB_ENV
          "FLOWMQ_SALTS_UTILS_RESOLVED_VERSION=$($saltsUtilsPkg.Name)" >> $env:GITHUB_ENV
          "FLOWMQ_PREFIX=$packages\flowmq.native\${{ needs.metadata.outputs.version }}\sdk\windows-x64" >> $env:GITHUB_ENV
      - name: Verify qualification vcpkg cache on Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vcpkg_installed
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=. \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --triplet "$FLOWMQ_TRIPLET" \
            --only-binarycaching
      - name: Verify qualification vcpkg cache on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed"
          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          & "$env:VCPKG_ROOT\vcpkg.exe" install "--x-manifest-root=." "--x-install-root=$installRoot" "--triplet=x64-windows" --only-binarycaching
          if ($LASTEXITCODE -ne 0) { throw "qualification x64-windows cache-only restore failed" }
      - name: Verify restored native consumer on Linux
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          export FLOWMQ_ROOT="$FLOWMQ_PREFIX"
          export LD_LIBRARY_PATH="$FLOWMQ_PREFIX/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/x64-linux/lib"
          cmake -S tests/package -B build/package-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$FLOWMQ_PREFIX;$SALTS_UTILS_ROOT;$SALTS_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/package-smoke --parallel 2
          build/package-smoke/flowmq_package_consumer
      - name: Verify restored native consumer on macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          export FLOWMQ_ROOT="$FLOWMQ_PREFIX"
          export DYLD_LIBRARY_PATH="$FLOWMQ_PREFIX/lib:$SALTS_UTILS_ROOT/lib:$SALTS_ROOT/lib:$GITHUB_WORKSPACE/vcpkg_installed/$FLOWMQ_TRIPLET/lib"
          cmake -S tests/package -B build/package-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$FLOWMQ_PREFIX;$SALTS_UTILS_ROOT;$SALTS_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="$FLOWMQ_TRIPLET" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed"
          cmake --build build/package-smoke --parallel 2
          build/package-smoke/flowmq_package_consumer
      - name: Verify restored native consumer on Windows
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "FLOWMQ_ROOT=%FLOWMQ_PREFIX%"
          set "PATH=%FLOWMQ_PREFIX%\bin;%SALTS_UTILS_ROOT%\bin;%SALTS_ROOT%\bin;%GITHUB_WORKSPACE%\vcpkg_installed\x64-windows\bin;%PATH%"
          cmake -S tests/package -B build/package-smoke -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH="%FLOWMQ_PREFIX%;%SALTS_UTILS_ROOT%;%SALTS_ROOT%" ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DVCPKG_MANIFEST_MODE=OFF ^
            -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed"
          if errorlevel 1 exit /b 1
          cmake --build build/package-smoke --parallel 2
          if errorlevel 1 exit /b 1
          build\package-smoke\flowmq_package_consumer.exe
          if errorlevel 1 exit /b 1
      - name: Verify restored Android consumer compile and link
        if: matrix.os == 'android'
        shell: bash
        run: |
          set -euo pipefail
          export FLOWMQ_ROOT="$FLOWMQ_PREFIX"
          cmake -S tests/package -B build/package-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Android \
            -DFlowMQ_DIR="$FLOWMQ_PREFIX/lib/cmake/FlowMQ" \
            -DCMAKE_PREFIX_PATH="$FLOWMQ_PREFIX;$SALTS_UTILS_ROOT;$SALTS_ROOT" \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-android \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared
          cmake --build build/package-smoke --parallel 2

  publish:
    needs: [metadata, pack, qualify]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowmq-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish qualified package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text
          dotnet nuget push "dist/FlowMQ.Native.$PACKAGE_VERSION.nupkg" \
            --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$PACKAGE_VERSION"
          pkg="dist/FlowMQ.Native.$PACKAGE_VERSION.nupkg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" --title "FlowMQ $PACKAGE_VERSION" --generate-notes
          fi
