name: FlowMQ native SDK package

on:
  workflow_dispatch:
    inputs:
      run_benchmarks:
        description: Run opt-in host ZMQ comparisons and Linux performance evidence (never on PR or release)
        type: boolean
        required: false
        default: false
      run_diagnostics:
        description: Run opt-in host wait-policy, progress-phase and SG attribution benchmarks
        type: boolean
        required: false
        default: false
      run_wake_benchmark:
        description: Compare ordinary polling and owner completion waits with an independent paced sender
        type: boolean
        required: false
        default: false
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: flowmq-sdk-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR qualification should release scarce platform runners, while
  # tag publication remains exact and is never cancelled by a later run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      source_version: ${{ steps.meta.outputs.source_version }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve source and package version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          source_version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          source_commit="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            expected_tag="v$source_version"
            if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
              echo "release tag mismatch: pushed=$GITHUB_REF_NAME expected=$expected_tag" >&2
              exit 1
            fi
            version="$source_version"
          else
            version="$source_version-ci.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi
          echo "source_version=$source_version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.rid }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04, rid: linux-x64, triplet: x64-linux, profile: linux-clang-x64 }
          - { os: windows, runner: windows-2025, rid: windows-x64, triplet: qigao-x64-windows-llvm-mingw, profile: windows-llvm-mingw-x64 }
          - { os: macos, runner: macos-15, rid: macos-arm64, triplet: arm64-osx, profile: macos-clang-arm64 }
          - { os: android, runner: ubuntu-24.04, rid: android-arm64-v8a, triplet: arm64-android, profile: android-arm64 }
    env:
      FLOWMQ_RID: ${{ matrix.rid }}
      FLOWMQ_TRIPLET: ${{ matrix.triplet }}
      FLOWMQ_ZMQ_BENCHMARK: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_benchmarks || inputs.run_diagnostics) && 'ON' || 'OFF' }}
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore native compiler objects
        if: matrix.os != 'windows'
        uses: actions/cache@v4
        with:
          path: build/ccache
          key: flowmq-ccache-split-${{ matrix.rid }}-${{ hashFiles('cmake/sdk-versions.json') }}-${{ github.sha }}
          restore-keys: flowmq-ccache-split-${{ matrix.rid }}-${{ hashFiles('cmake/sdk-versions.json') }}-
      - name: Set up llvm-mingw
        if: matrix.os == 'windows'
        id: mingw
        uses: qigao/vcpkg-cache/.github/actions/setup-llvm-mingw@v0.1.3
        with:
          version: "20261020"
          target: x64
      - name: Install Unix build tools
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install ninja ccache
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build ccache
          fi
      - name: Restore pinned SDKs
        shell: bash
        run: |
          python cmake/ci/restore-split-sdks.py --profile "${{ matrix.profile }}" \
            --triplet "$FLOWMQ_TRIPLET" --destination build/dependencies
      - name: Configure, build, test and install
        shell: bash
        env:
          MINGW_ROOT: ${{ steps.mingw.outputs.root }}
          MINGW_CC: ${{ steps.mingw.outputs.cc }}
          MINGW_CXX: ${{ steps.mingw.outputs.cxx }}
          SOURCE_VERSION: ${{ needs.metadata.outputs.source_version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          prefix="stage/sdk/$FLOWMQ_RID"
          args=(-DCMAKE_PREFIX_PATH="$FLOWMQ_DEPENDENCY_PREFIX"
                -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/$prefix"
                -DFLOWMQ_BUILD_ZMQ_BENCHMARK="$FLOWMQ_ZMQ_BENCHMARK")
          qualification=runtime
          case "${{ matrix.os }}" in
            windows)
              printf '%s\n' "$MINGW_ROOT/bin" "$MINGW_ROOT/x86_64-w64-mingw32/bin" >> "$GITHUB_PATH"
              export PATH="$MINGW_ROOT/bin:$MINGW_ROOT/x86_64-w64-mingw32/bin:$PATH"
              args+=(-DCMAKE_C_COMPILER="$MINGW_CC" -DCMAKE_CXX_COMPILER="$MINGW_CXX")
              ;;
            linux|macos)
              args+=(-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
                     -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
              ;;
            android)
              args+=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
                     -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared
                     -DCMAKE_C_COMPILER_LAUNCHER=ccache -DFLOWMQ_BUILD_ZMQ_BENCHMARK=OFF)
              qualification=compile-link
              ;;
          esac
          if [[ "$qualification" == runtime ]]; then
            args+=(-DBUILD_TESTS=ON)
          else
            args+=(-DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF)
          fi
          cmake -S . -B build/flowmq -G Ninja "${args[@]}"
          cmake --build build/flowmq --parallel 2
          if [[ "$qualification" == runtime ]]; then
            ctest --test-dir build/flowmq -LE benchmark --no-tests=error --output-on-failure
          fi
          cmake --install build/flowmq
          cat > "$prefix/flowmq-sdk-manifest.txt" <<EOF
          version=$PACKAGE_VERSION
          source_version=$SOURCE_VERSION
          repository=https://github.com/qigao/flowmq
          source_ref=$GITHUB_REF_NAME
          commit=$SOURCE_COMMIT
          salts_base=$SALTS_BASE_VERSION
          cmeta=$CMETA_VERSION
          salts_cnet=$SALTSCORE_VERSION
          salts_utils=$SALTS_UTILS_VERSION
          rid=$FLOWMQ_RID
          build_type=Release
          qualification=$qualification
          EOF
      - name: Record host comparison provenance
        if: matrix.os != 'android' && github.event_name == 'workflow_dispatch' && (inputs.run_benchmarks || inputs.run_diagnostics || inputs.run_wake_benchmark)
        shell: pwsh
        run: |
          $evidence = [ordered]@{
            source_commit = '${{ needs.metadata.outputs.source_commit }}'
            salts_base = $env:SALTS_BASE_VERSION
            cmeta = $env:CMETA_VERSION
            salts_cnet = $env:SALTSCORE_VERSION
            salts_utils = $env:SALTS_UTILS_VERSION
            rid = $env:FLOWMQ_RID
            runner_os = '${{ runner.os }}'
            runner_arch = '${{ runner.arch }}'
            logical_processors = [Environment]::ProcessorCount
            affinity = 'unbound'
            configuration = 'Release'
            paired_runs = ${{ inputs.run_benchmarks && 5 || 0 }}
            lane_runs_per_configuration = ${{ inputs.run_benchmarks && 5 || 0 }}
            wait_policy_runs_per_configuration = ${{ inputs.run_diagnostics && 4 || 0 }}
            sg_sweep_runs_per_configuration = ${{ inputs.run_diagnostics && 10 || 0 }}
            progress_phase_runs_per_configuration = ${{ inputs.run_diagnostics && 3 || 0 }}
            progress_ablation_runs_per_configuration = ${{ inputs.run_diagnostics && 6 || 0 }}
            wake_runs_per_configuration = ${{ inputs.run_wake_benchmark && 5 || 0 }}
          }
          $evidence | ConvertTo-Json | Set-Content build/flowmq-zmq-provenance.json
      - name: Compare incoming wake latency on Unix hosts
        if: (matrix.os == 'linux' || matrix.os == 'macos') && github.event_name == 'workflow_dispatch' && inputs.run_wake_benchmark
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/flowmq --no-tests=error -R '^bench_flowmq_wake$' -V --output-log build/flowmq-wake.log
      - name: Compare incoming wake latency on Windows
        if: matrix.os == 'windows' && github.event_name == 'workflow_dispatch' && inputs.run_wake_benchmark
        shell: cmd
        run: |
          ctest --test-dir build/flowmq --no-tests=error -R "^bench_flowmq_wake$" -V --output-log build/flowmq-wake.log
          if errorlevel 1 exit /b 1
      - name: Upload host wake evidence
        if: always() && matrix.os != 'android' && github.event_name == 'workflow_dispatch' && inputs.run_wake_benchmark
        uses: actions/upload-artifact@v4
        with:
          name: flowmq-wake-${{ matrix.os }}
          path: |
            build/flowmq-zmq-provenance.json
            build/flowmq-wake.log
          if-no-files-found: error
      - name: Attribute progress and retained costs on Unix hosts
        if: (matrix.os == 'linux' || matrix.os == 'macos') && github.event_name == 'workflow_dispatch' && inputs.run_diagnostics
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/flowmq --no-tests=error -R '^bench_flowmq_(wait_policy|progress_phases|progress_ablation|lane_sg_sweep)$' \
            -V --output-log build/flowmq-diagnostics.log
      - name: Attribute progress and retained costs on Windows
        if: matrix.os == 'windows' && github.event_name == 'workflow_dispatch' && inputs.run_diagnostics
        shell: cmd
        run: |
          ctest --test-dir build/flowmq --no-tests=error -R "^bench_flowmq_(wait_policy|progress_phases|progress_ablation|lane_sg_sweep)$" -V --output-log build/flowmq-diagnostics.log
          if errorlevel 1 exit /b 1
      - name: Upload host diagnostic evidence
        if: always() && matrix.os != 'android' && github.event_name == 'workflow_dispatch' && inputs.run_diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: flowmq-diagnostics-${{ matrix.os }}
          path: |
            build/flowmq-zmq-provenance.json
            build/flowmq-diagnostics.log
          if-no-files-found: error
      - name: Compare FlowMQ and ZMQ on Unix hosts
        if: (matrix.os == 'linux' || matrix.os == 'macos') && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/flowmq --no-tests=error -R '^bench_flowmq_zmq_comparison$' \
            --repeat until-fail:5 -V --output-log build/flowmq-zmq-paired.log
          ctest --test-dir build/flowmq --no-tests=error -R '^bench_flowmq_lane_handoff$' \
            -V --output-log build/flowmq-zmq-lanes.log
      - name: Compare FlowMQ and ZMQ on Windows
        if: matrix.os == 'windows' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: cmd
        run: |
          ctest --test-dir build/flowmq --no-tests=error -R "^bench_flowmq_zmq_comparison$" --repeat until-fail:5 -V --output-log build/flowmq-zmq-paired.log
          if errorlevel 1 exit /b 1
          ctest --test-dir build/flowmq --no-tests=error -R "^bench_flowmq_lane_handoff$" -V --output-log build/flowmq-zmq-lanes.log
          if errorlevel 1 exit /b 1
      - name: Upload host ZMQ comparison evidence
        if: always() && matrix.os != 'android' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: flowmq-zmq-${{ matrix.os }}
          path: |
            build/flowmq-zmq-provenance.json
            build/flowmq-zmq-paired.log
            build/flowmq-zmq-lanes.log
          if-no-files-found: error
      - name: Compare peer pool on native Unix owners
        if: (matrix.os == 'linux' || matrix.os == 'macos') && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/flowmq -R '^bench_flowmq_peer_pool_' -V \
            --output-log build/peer-pool-comparison.log
      - name: Compare peer pool on Windows owners
        if: matrix.os == 'windows' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: cmd
        run: |
          ctest --test-dir build/flowmq -R "^bench_flowmq_peer_pool_" -V --output-log build/peer-pool-comparison.log
          if errorlevel 1 exit /b 1
      - name: Upload peer pool comparison
        if: always() && matrix.os != 'android' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        uses: actions/upload-artifact@v4
        with:
          name: flowmq-peer-pool-${{ matrix.os }}
          path: build/peer-pool-comparison.log
          if-no-files-found: error
      - name: Run FlowMQ owner-affine multicore benchmark
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_BASE_ROOT/lib:$SALTSCORE_ROOT/lib:$FLOWMQ_DEPENDENCY_PREFIX/lib"
          result_dir="$GITHUB_WORKSPACE/flowmq-benchmark-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_owner_parallel"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ owner-parallel benchmark executable not found: $benchmark" >&2
            exit 1
          fi

          allowed="$(taskset -pc "$BASHPID" | sed 's/.*: //')"
          topology="$result_dir/cpu-topology.csv"
          lscpu -p=CPU,CORE,SOCKET > "$topology"

          expand_cpuset() {
            local spec="$1"
            local part start end cpu
            IFS=',' read -ra parts <<< "$spec"
            for part in "${parts[@]}"; do
              if [[ "$part" == *-* ]]; then
                start="${part%-*}"
                end="${part#*-}"
                for ((cpu = start; cpu <= end; ++cpu)); do echo "$cpu"; done
              else
                echo "$part"
              fi
            done
          }

          mapfile -t cpus < <(expand_cpuset "$allowed")
          if (( ${#cpus[@]} == 0 )); then
            echo "No CPUs found in allowed set: $allowed" >&2
            exit 1
          fi
          first="${cpus[0]}"
          first_key="$(awk -F, -v cpu="$first" '$1 == cpu {print $2 ":" $3; exit}' "$topology")"
          if [[ -z "$first_key" ]]; then
            echo "CPU topology is unavailable for CPU $first" >&2
            exit 1
          fi
          same_core=""
          distinct_core=""
          for cpu in "${cpus[@]:1}"; do
            key="$(awk -F, -v wanted="$cpu" '$1 == wanted {print $2 ":" $3; exit}' "$topology")"
            [[ -z "$key" ]] && continue
            if [[ "$key" == "$first_key" && -z "$same_core" ]]; then
              same_core="$cpu"
            elif [[ "$key" != "$first_key" && -z "$distinct_core" ]]; then
              distinct_core="$cpu"
            fi
          done

          run_case() {
            local label="$1"
            local cpuset="$2"
            [[ -z "$cpuset" || "$cpuset" == "unavailable" ]] && return 0
            local cpu_a="${cpuset%%,*}"
            local cpu_b="$cpu_a"
            if [[ "$cpuset" == *,* ]]; then
              cpu_b="${cpuset##*,}"
            fi
            local prefix="$result_dir/flowmq-owner-parallel-$label"
            export FLOWMQ_OWNER_PARALLEL_TOPOLOGY="$label"
            export FLOWMQ_OWNER_PARALLEL_CPU_A="$cpu_a"
            export FLOWMQ_OWNER_PARALLEL_CPU_B="$cpu_b"
            export FLOWMQ_OWNER_PARALLEL_OUTPUT="$prefix"

            "$benchmark" 2>&1 | tee "$prefix.md"
            {
              echo ""
              echo "## FlowMQ owner-affine multicore: $label (owners $cpu_a,$cpu_b)"
              echo ""
              cat "$prefix.md"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          echo "runner_allowed_cpu_set=$allowed" > "$result_dir/cpu-set.txt"
          echo "one_cpu_set=$first" >> "$result_dir/cpu-set.txt"
          echo "two_cpu_same_core_set=$([[ -n "$same_core" ]] && echo "$first,$same_core" || echo unavailable)" >> "$result_dir/cpu-set.txt"
          echo "two_cpu_distinct_core_set=$([[ -n "$distinct_core" ]] && echo "$first,$distinct_core" || echo unavailable)" >> "$result_dir/cpu-set.txt"

          run_case one_cpu "$first"
          if [[ -n "$same_core" ]]; then
            run_case two_cpu_same_core "$first,$same_core"
          else
            echo "No SMT sibling is available on the first physical core; same-core case skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n "$distinct_core" ]]; then
            run_case two_cpu_distinct_core "$first,$distinct_core"
          else
            echo "No distinct physical core is available; distinct-core case skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run FlowMQ shared owner-wait benchmark
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_BASE_ROOT/lib:$SALTSCORE_ROOT/lib:$FLOWMQ_DEPENDENCY_PREFIX/lib"
          source "$GITHUB_WORKSPACE/flowmq-benchmark-results/cpu-set.txt"
          result_dir="$GITHUB_WORKSPACE/flowmq-shared-wait-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_owner_shared_wait"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ shared-wait benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          export FLOWMQ_SHARED_WAIT_CPU="$one_cpu_set"
          export FLOWMQ_SHARED_WAIT_OUTPUT="$result_dir/flowmq-shared-wait"
          "$benchmark" 2>&1 | tee "$result_dir/flowmq-shared-wait.md"
          {
            echo ""
            echo "## FlowMQ public owner lane vs legacy multi-socket poll (owner CPU $one_cpu_set)"
            echo ""
            cat "$result_dir/flowmq-shared-wait.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run FlowMQ reuse-port multicore service benchmark
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_BASE_ROOT/lib:$SALTSCORE_ROOT/lib:$FLOWMQ_DEPENDENCY_PREFIX/lib"
          source "$GITHUB_WORKSPACE/flowmq-benchmark-results/cpu-set.txt"
          result_dir="$GITHUB_WORKSPACE/flowmq-reuse-port-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_reuse_port_multicore"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ reuse-port benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          if [[ "$two_cpu_distinct_core_set" == "unavailable" ]]; then
            echo "No distinct physical core pair is available; reuse-port multicore benchmark skipped." | tee "$result_dir/skipped.md" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            cpu_a="${two_cpu_distinct_core_set%%,*}"
            cpu_b="${two_cpu_distinct_core_set##*,}"
            export FLOWMQ_REUSE_PORT_CPU_A="$cpu_a"
            export FLOWMQ_REUSE_PORT_CPU_B="$cpu_b"
            export FLOWMQ_REUSE_PORT_OUTPUT="$result_dir/flowmq-reuse-port-multicore"
            "$benchmark" 2>&1 | tee "$result_dir/flowmq-reuse-port-multicore.md"
            {
              echo ""
              echo "## FlowMQ same-endpoint reuse-port multicore service (owners $cpu_a,$cpu_b)"
              echo ""
              cat "$result_dir/flowmq-reuse-port-multicore.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run FlowMQ retained TLS natural framing benchmark
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: bash
        env:
          FLOWMQ_BENCH_CI: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_BASE_ROOT/lib:$SALTSCORE_ROOT/lib:$FLOWMQ_DEPENDENCY_PREFIX/lib"
          result_dir="$GITHUB_WORKSPACE/flowmq-retained-tls-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_socket"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ socket benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          log="$result_dir/flowmq-retained-tls.md"
          "$benchmark" 2>&1 | tee "$log"
          if grep -q '^TLS_EVIDENCE_FAIL ' "$log"; then
            echo "TLS retained evidence contains a failed operation" >&2
            exit 1
          fi
          if grep -q '^OWNED_RX_EVIDENCE_FAIL ' "$log"; then
            echo "owned receive evidence contains a failed operation" >&2
            exit 1
          fi
          grep -q '^OWNED_RX_EVIDENCE_BEGIN transport=tcp$' "$log"
          grep -q '^OWNED_RX_EVIDENCE_END transport=tcp$' "$log"
          for payload in 64 65536 1048576; do
            grep -q "^OWNED_RX_EVIDENCE mode=copy payload_bytes=$payload " "$log"
            grep -q "^OWNED_RX_EVIDENCE mode=slice payload_bytes=$payload " "$log"
            grep -q "^OWNED_RX_EVIDENCE mode=slicev payload_bytes=$payload " "$log"
          done
          # Payload and ownership invariants are checked by the benchmark;
          # TCP fragmentation does not guarantee a particular storage shape.
          sed -n '/^OWNED_RX_EVIDENCE_BEGIN /,/^OWNED_RX_EVIDENCE_END /p' "$log" \
            > "$result_dir/flowmq-owned-receive.md"
          grep -q '^TLS_EVIDENCE_BEGIN layout=natural_discontiguous$' "$log"
          grep -q '^TLS_EVIDENCE_END layout=natural_discontiguous$' "$log"
          for row in copy_64b retained_64b copy_64k retained_64k copy_1m retained_1m copy_2x256k retained_2x256k; do
            grep -q "^TLS_EVIDENCE name=$row " "$log"
          done
          {
            echo ""
            echo "## FlowMQ retained TLS natural framing"
            echo ""
            sed -n '/^TLS_EVIDENCE_BEGIN /,/^TLS_EVIDENCE_END /p' "$log"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run FlowMQ retained fanout benchmark
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        shell: bash
        env:
          FLOWMQ_BENCH_CI: "1"
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$SALTS_UTILS_ROOT/lib:$SALTS_BASE_ROOT/lib:$SALTSCORE_ROOT/lib:$FLOWMQ_DEPENDENCY_PREFIX/lib"
          result_dir="$GITHUB_WORKSPACE/flowmq-fanout-results"
          benchmark="$GITHUB_WORKSPACE/build/flowmq/bin/bench_flowmq_retained_fanout"
          mkdir -p "$result_dir"
          if [[ ! -x "$benchmark" ]]; then
            echo "FlowMQ retained fanout benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          export FLOWMQ_FANOUT_OUTPUT="$result_dir/flowmq-retained-fanout"
          "$benchmark" 2>&1 | tee "$result_dir/flowmq-retained-fanout.md"
          {
            echo ""
            echo "## FlowMQ retained fanout evidence"
            echo ""
            cat "$result_dir/flowmq-retained-fanout.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        with:
          name: flowmq-retained-fanout-linux-x64
          path: flowmq-fanout-results
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        with:
          name: flowmq-owned-receive-linux-x64
          path: flowmq-retained-tls-results/flowmq-owned-receive.md
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        with:
          name: flowmq-retained-tls-linux-x64
          path: flowmq-retained-tls-results
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        with:
          name: flowmq-reuse-port-linux-x64
          path: flowmq-reuse-port-results
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        with:
          name: flowmq-shared-wait-linux-x64
          path: flowmq-shared-wait-results
          if-no-files-found: error
          compression-level: 6
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'linux' && github.event_name == 'workflow_dispatch' && inputs.run_benchmarks
        with:
          name: flowmq-owner-parallel-linux-x64
          path: flowmq-benchmark-results
          if-no-files-found: error
          compression-level: 6
      - name: Report compiler cache statistics
        if: always() && matrix.os != 'windows'
        shell: bash
        run: ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-sdk-${{ matrix.rid }}
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack FlowMQ.Native
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: flowmq-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify combined SDK payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/FlowMQ/FlowMQConfig.cmake
          test -f package/sdk/windows-x64/lib/cmake/FlowMQ/FlowMQConfig.cmake
          test -f package/sdk/android-arm64-v8a/lib/cmake/FlowMQ/FlowMQConfig.cmake
          mapfile -t mac_dirs < <(find package/sdk -mindepth 1 -maxdepth 1 -type d -name 'macos-*' -print)
          test "${#mac_dirs[@]}" -eq 1
          test -f "${mac_dirs[0]}/lib/cmake/FlowMQ/FlowMQConfig.cmake"
          test "$(find package/sdk -maxdepth 2 -name flowmq-sdk-manifest.txt | wc -l)" -eq 4
          find package/sdk -maxdepth 2 -name flowmq-sdk-manifest.txt -print
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Pack multi-platform NuGet
        shell: bash
        run: |
          dotnet pack packaging/nuget/FlowMQ.Native.csproj \
            --configuration Release --output dist \
            -p:PackageVersion="${{ needs.metadata.outputs.version }}" \
            -p:PackageRoot="$GITHUB_WORKSPACE/package"
      - uses: actions/upload-artifact@v4
        with:
          name: flowmq-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    needs: [metadata, pack]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flowmq-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish qualified package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text
          dotnet nuget push "dist/FlowMQ.Native.$PACKAGE_VERSION.nupkg" \
            --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$PACKAGE_VERSION"
          pkg="dist/FlowMQ.Native.$PACKAGE_VERSION.nupkg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$pkg" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_COMMIT" --title "FlowMQ $PACKAGE_VERSION" --generate-notes
          fi
